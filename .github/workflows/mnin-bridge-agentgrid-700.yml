name: MNIN Bridge - Original AgentGrid 700 verification
on:
  pull_request:
    paths:
      - 'mnin-bridge/agentgrid/**'
      - 'mnin-bridge/agentgrid.py'
      - 'mnin-bridge/agentgrid_proof.py'
      - 'mnin-bridge/tests/test_agentgrid_700.py'
      - 'mnin-bridge/tests/test_agentgrid_proof.py'
      - '.github/workflows/mnin-bridge-agentgrid-700.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-existing-profiles:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate Python files and entire MNIN Bridge suite
        run: |
          python -m compileall -q mnin-bridge
          python -m unittest discover -s mnin-bridge/tests -v
      - name: Verify all 700 original role definitions with no AI runtime
        run: python mnin-bridge/agentgrid_proof.py --output mnin-bridge-qa-results/agentgrid-700-report.json
      - name: Independently verify evidence and no false AI agent claims
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('mnin-bridge-qa-results/agentgrid-700-report.json')
          evidence=json.loads(p.read_text())
          assert evidence['existing_role_definitions']==700
          assert evidence['unique_ids']==700
          assert evidence['per_profile_structural_checks_executed']==700
          assert len(evidence['dsi_coverage'])==5
          assert all(v==140 for v in evidence['dsi_coverage'].values())
          assert len(evidence['mission_routes'])==7
          assert evidence['independent_ai_agent_sessions_started']==0
          assert evidence['ai_inference_calls']==0
          assert evidence['wordpress_changes']==0
          assert evidence['cloudflare_writes']==0
          print('AGENTGRID_700_EVIDENCE_VERIFIED: structural checks, not running LLMs')
          PY
      - name: Upload verified report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mnin-agentgrid-700-verified-role-plans
          path: mnin-bridge-qa-results/agentgrid-700-report.json
          if-no-files-found: warn
          retention-days: 7
