name: MNIN Bridge - BrowserLab end-to-end evidence
on:
  pull_request:
    paths:
      - 'preview/bridge-smoke.html'
      - 'mnin-bridge/runner/**'
      - '.github/workflows/mnin-bridge-browser-e2e.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install OSS libraries and Chromium in disposable runner
        working-directory: mnin-bridge/runner
        run: |
          npm install --no-audit --no-fund --no-package-lock
          npx playwright install --with-deps chromium
      - name: Verify Node packages really interoperate
        working-directory: mnin-bridge/runner
        run: npm run oss:smoke
      - name: Start local preview only
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/mnin-bridge-http.log 2>&1 &
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent http://127.0.0.1:8765/preview/bridge-smoke.html >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Run all 21 viewport screenshots and axe-core QA
        env:
          MNIN_HOME_PATH: preview/bridge-smoke.html
          MNIN_QA_MATRIX: full
          MNIN_A11Y_MODE: 'on'
        run: node mnin-bridge/runner/home-qa.mjs
      - name: Check QA JSON and screenshot evidence
        run: |
          python3 - <<'PY'
          import json, pathlib
          root=pathlib.Path('mnin-bridge-qa-results')
          data=json.loads((root/'report.json').read_text())
          assert data['mode']=='full'
          assert data['total']==21
          assert data['failures']==0, data
          assert all(row['accessibility']['status']=='PASS' for row in data['tests']), data
          assert len(list(root.glob('*-viewport.png')))==21
          assert len(list(root.glob('*-full-page.png')))==21
          print('BROWSERLAB_E2E_PASS: 21 viewport + 21 full-page screenshots')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mnin-bridge-browserlab-synthetic-fixture
          path: mnin-bridge-qa-results/
          retention-days: 3
          if-no-files-found: warn
