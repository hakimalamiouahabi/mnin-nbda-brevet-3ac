name: Validation organigramme (sans API)
on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Contrôle structure des agents et PHP si disponible
        run: python3 scripts/validate_workspace.py
