name: Validation organigramme (sans API)
on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Contrôle structure des agents et PHP si disponible
        run: python3 scripts/validate_workspace.py
      - name: Syntaxe Python MNIN Bridge
        run: python3 -m compileall -q mnin-bridge
      - name: Tests standard library du plugin Pro
        run: python3 -m unittest discover -s mnin-bridge/tests -v
