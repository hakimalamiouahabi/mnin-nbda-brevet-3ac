name: Audits open source du depot (sans IA ni secrets)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/**"
      - "docs/OPEN_SOURCE_700_TOOLBOX.md"
permissions:
  contents: read
jobs:
  audit:
    name: Ruff + Bandit + zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Recuperer les fichiers sans conserver de jeton
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Preparer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Installer trois outils libres avec versions fixes
        run: python -m pip install --disable-pip-version-check ruff==0.17.0 bandit==1.9.4 zizmor==1.30.1
      - name: Verifier la syntaxe Python
        run: python -m compileall -q scripts tests
      - name: Ruff - erreurs de code probables
        run: ruff check scripts tests --select E4,E7,E9,F --output-format concise
      - name: Bandit - problemes de securite Python moyens et graves
        run: bandit -r scripts tests -ll --skip B101
      - name: zizmor - risques graves dans les automatisations GitHub
        run: zizmor --offline --min-severity high .github/workflows
